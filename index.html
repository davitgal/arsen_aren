<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Հյուրերի նստատեղեր</title>
  <link rel="stylesheet" id="styles" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" aria-label="Հետ" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18 L9 12 L15 6"/>
      </svg>
    </button>
    <h1 id="title">Սեղաններ</h1>
  </header>

  <div class="search-wrap">
    <input
      id="search"
      type="search"
      inputmode="search"
      autocomplete="off"
      placeholder="Որոնել հյուր (օրինակ՝ Կարեն)"
      aria-label="Որոնել հյուր"
    />
    <button id="clearSearch" class="clear-btn" aria-label="Մաքրել" hidden>✕</button>
  </div>

  <div id="dashboard" class="dashboard"></div>

  <main id="content" class="content"></main>

  <script>
    // Cache-busting: ստիպում ենք բրաուզերին միշտ բեռնել թարմ ֆայլերը
    (function () {
      var v = Date.now();
      document.getElementById('styles').href = 'styles.css?v=' + v;
      function load(src, cb) {
        var s = document.createElement('script');
        s.src = src + '?v=' + v;
        s.onload = cb;
        document.body.appendChild(s);
      }
      load('config.js', function () {
        load('data.js', function () { load('app.js'); });
      });
    })();
  </script>
</body>
</html>
